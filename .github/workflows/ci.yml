name: CI

# The same checks as the README's Develop section, on Ubuntu, macOS and Windows: the price table, the
# manifest and hooks validation, the mod's tests, and a self-test that runs the scripts for real.
# Validation runs with --strict so a warning the runtime would tolerate still fails here.
#
# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment, and Dependabot moves the
# SHA the same way it would move a tag. A tag is a moving pointer: whoever controls an action's repository
# can repoint it, and the code it then runs is inside this job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CLI that validates and tests the mod. Pinned so a Claude Code release cannot change the gate
  # under an unchanged branch; move it on purpose when the mod API moves.
  CLAUDE_CODE_VERSION: 2.1.301

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # One shell on every OS, so $CLAUDE_CODE_VERSION expands the same way on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Price table
        run: node scripts/check.mjs
      - name: Self-test the scripts
        run: node scripts/selftest.mjs
      - name: Validate manifests and hooks
        run: claude plugin validate --strict .
      - name: Tests
        run: claude plugin test .
