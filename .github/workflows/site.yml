name: Site

# The site is its own gate, on its own trigger. It runs when the site changes, and when
# a file it reads at build time does: site/lib/repo.ts takes the version from
# plugin.json, the price table from scripts/prices.mjs and the band mock-up from
# README.md, so an edit to any of them can break the build without touching site/.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.claude-plugin/plugin.json'
      - 'scripts/prices.mjs'
      - 'README.md'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.claude-plugin/plugin.json'
      - 'scripts/prices.mjs'
      - 'README.md'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # Biome (format, import order, lint) -> ESLint (React, Next) -> tsc.
      # The non-mutating mode, so a branch is never quietly reformatted.
      - name: Quality gate
        working-directory: site
        run: npm run check:ci

      # Must build from inside the repository: lib/repo.ts reads the plugin's own files.
      - name: Build
        working-directory: site
        run: npm run build
